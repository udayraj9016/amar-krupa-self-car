<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amar Krupa Self Drive | Botad</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    /* ================= HEADER ================= */

    header {
      background: #ffffff;
      padding: 12px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo img {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }

    .logo h2 {
      color: #07549b;
      font-size: 20px;
      line-height: 1.2;
    }

    .logo span {
      color: #e87922;
    }

    nav a {
      text-decoration: none;
      color: #172033;
      margin-left: 22px;
      font-weight: bold;
    }

    nav a:hover {
      color: #07549b;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .hero video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      color: white;
      max-width: 800px;
    }

    .hero-content h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero-content h1 span {
      color: #ff8a25;
    }

    .hero-content p {
      font-size: 24px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      margin: 8px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #07549b;
      color: white;
    }

    .btn-primary:hover {
      background: #063b70;
      transform: translateY(-3px);
    }

    .btn-orange {
      background: #e87922;
      color: white;
    }

    .btn-orange:hover {
      background: #c75e0c;
      transform: translateY(-3px);
    }

    /* ================= SECTIONS ================= */

    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      font-size: 35px;
      color: #07549b;
      margin-bottom: 45px;
    }

    .section-title span {
      color: #e87922;
    }

    /* ================= ABOUT ================= */

    .about {
      text-align: center;
      max-width: 850px;
      margin: auto;
      font-size: 19px;
      line-height: 1.8;
    }

    /* ================= QUICK CONTACT ================= */

    .quick-contact {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      padding: 35px 20px;
      background: #ffffff;
      flex-wrap: wrap;
    }

    .quick-contact-item {
      width: 105px;
      height: 105px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: white;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .quick-contact-item i {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .quick-contact-item span {
      font-size: 14px;
      font-weight: bold;
    }

    .quick-contact-item:hover {
      transform: translateY(-7px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .call-icon {
      background: #07549b;
    }

    .whatsapp-icon {
      background: #25D366;
    }

    .instagram-icon {
      background: #E1306C;
    }

    /* ================= CARS ================= */

    .cars-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .car-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
      transition: 0.3s;
    }

    .car-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.18);
    }

    .car-card img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    .car-info {
      padding: 25px;
    }

    .car-info h3 {
      font-size: 28px;
      color: #07549b;
      margin-bottom: 10px;
    }

    .car-info p {
      color: #555;
      margin-bottom: 15px;
    }

    /* ================= BOOKING ================= */

    .booking-section {
      background: #eef3f8;
    }

    .booking-box {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .booking-box h3 {
      text-align: center;
      color: #07549b;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .booking-subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #172033;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #07549b;
      box-shadow: 0 0 0 2px rgba(7,84,155,0.10);
    }

    .form-group textarea {
      height: 100px;
      resize: vertical;
    }

    .booking-button {
      width: 100%;
      background: #25D366;
      color: white;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .booking-button:hover {
      background: #1da851;
      transform: translateY(-2px);
    }

    .booking-note {
      text-align: center;
      margin-top: 15px;
      color: #777;
      font-size: 14px;
    }

    /* ================= WHY CHOOSE US ================= */

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .feature {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .feature .icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .feature h3 {
      color: #07549b;
      margin-bottom: 10px;
    }

    /* ================= CONTACT ================= */
